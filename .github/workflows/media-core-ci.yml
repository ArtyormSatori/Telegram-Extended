name: Shared Media Core CI
on:
  push:
    paths: ['core/media-core/**', '.github/workflows/media-core-ci.yml']
  pull_request:
    paths: ['core/media-core/**', '.github/workflows/media-core-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core/media-core -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
